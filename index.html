<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신혼여행 일정 안내 · 유진 ♥ 재홍</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/variable/pretendardvariable.css">
<style>
:root{
  --ink:#2B2A28;
  --sub:#8C8573;
  --line:#EFEAE0;
  --mustard:#FED57D; --mustard-wash:#F7F1E8;  /* butter yellow · latte */
  --coral:#F0A351;   --coral-wash:#FCEDED;    /* apricot jam · milk shake */
  --indigo:#98C1E9;  --indigo-wash:#E7F5F9;   /* attic window · seafoam */
  --green:#BD6565;   --green-wash:#FCEDED;    /* milk shake, deepened for readable contrast on white */
  --kr-badge:#FCEDED;                          /* milk shake — 한국 시계 블럭 배경, 원색 그대로 */
  --blush:#FDD0D0;                             /* ballet slipper */
  --font:'Pretendard Variable',Pretendard,-apple-system,system-ui,'Noto Sans KR',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:#fff;font-family:var(--font);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased;padding:clamp(16px,3vw,40px) 16px}
.page{max-width:820px;margin:0 auto;padding-bottom:70px}

/* ---------- hero ---------- */
.hero{text-align:center}
.hero h1{font-weight:800;font-size:clamp(30px,6.5vw,50px);letter-spacing:-.02em}
.hero .sub{margin-top:12px;font-size:clamp(15px,2vw,18px);color:var(--sub)}

/* ---------- world clocks ---------- */
.clocks{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:40px}
.clock{border:1px solid var(--line);border-radius:18px;padding:18px 10px;text-align:center}
.clock .lbl{font-weight:700;font-size:12.5px;color:var(--sub);letter-spacing:.01em}
.clock .time{margin-top:9px;font-weight:800;font-size:clamp(21px,4vw,28px);font-variant-numeric:tabular-nums}
.clock .date{margin-top:5px;font-size:11.5px;color:var(--sub)}
.clock.kr{background:var(--kr-badge);border-color:var(--kr-badge)}
.clock.kr .lbl,.clock.kr .date{color:rgba(38,34,32,.65)}
.clock.kr .time{color:var(--ink)}
@media(max-width:560px){.clocks{grid-template-columns:repeat(2,1fr)}}

.status{text-align:center;margin-top:18px;font-size:14.5px;font-weight:700;color:var(--sub)}

/* ---------- gradient timeline ---------- */
.timeline{margin-top:36px}
.gantt-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:16px}
.gantt{min-width:720px;display:grid}
.g-cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:9px 4px;text-align:center;font-size:11px;font-weight:600;letter-spacing:.02em}
.g-cell.last{border-right:none}
.g-cell.today{background:var(--ink);color:#fff}
.g-cell .fly{display:block;font-size:10px}
.g-strip{grid-column:1/-1;position:relative;height:60px}
.g-strip .seg{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;letter-spacing:.01em}
.g-strip .seg span{background:rgba(255,255,255,.6);border:1px solid var(--line);border-radius:99px;padding:3px 13px;backdrop-filter:blur(2px)}
.timeline-note{margin-top:9px;font-size:12.5px;color:var(--sub);text-align:center}

/* ---------- day blocks ---------- */
.days{margin-top:20px}
.day{margin-top:56px;padding-left:24px;border-left:5px solid var(--bar);scroll-margin-top:16px}
.day-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 14px}
.day-num{font-weight:700;font-size:12px;letter-spacing:.02em;color:var(--sub);background:var(--wash);padding:4px 11px;border-radius:99px}
.day-head h2{font-weight:800;font-size:clamp(22px,4vw,28px)}
.day-head h2 small{font-weight:600;font-size:.58em;color:var(--sub);margin-left:3px}
.day-city{font-size:13.5px;font-weight:700;color:var(--sub)}
.day-title{margin-top:8px;font-size:16.5px;font-weight:700}

.events{margin-top:18px}
.ev{display:grid;grid-template-columns:148px 1fr;gap:18px 22px;padding:21px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:none;padding-top:14px}
.tm{display:flex;flex-direction:column;gap:5px}
.tm .loc{font-weight:800;font-size:clamp(19px,3vw,24px);font-variant-numeric:tabular-nums}
.tm .kr{font-weight:800;font-size:clamp(19px,3vw,24px);color:var(--green);font-variant-numeric:tabular-nums;line-height:1.15}
.tm .kr small{display:block;font-weight:700;font-size:11px;color:var(--green);letter-spacing:.02em;margin-bottom:2px}
.tm .krtag{font-weight:700;font-size:11px;color:var(--green);letter-spacing:.02em}
.bd .x{font-size:17.5px;line-height:1.6}
.bd .x.hl{font-weight:700;background:linear-gradient(180deg, transparent 44%, var(--blush) 44%, var(--blush) 92%, transparent 92%);padding:0 2px;border-radius:2px}
.bd .n{margin-top:7px;font-size:13.5px;color:var(--sub);line-height:1.75;white-space:pre-line}
@media(max-width:560px){
  .ev{grid-template-columns:1fr;gap:4px;padding:18px 0}
  .tm{flex-direction:row;align-items:baseline;gap:14px;margin-bottom:4px}
  .tm .kr small{display:inline;margin-right:3px}
}

.foot{text-align:center;margin-top:66px;font-size:13.5px;color:var(--sub)}
.foot .heart{color:var(--coral)}
</style>
</head>
<body>
<div class="page">

  <div class="hero">
    <h1>신혼여행 일정 안내</h1>
    <p class="sub">유진 ♥ 재홍 · 2026년 10월 25일 – 11월 6일</p>
  </div>

    <p class="timeline-note">도시명을 누르면 해당 날짜로 바로 이동해요</p>
  </div>

  <div class="days" id="days"></div>

  <p class="foot">예쁘게 잘 다녀올게요 <span class="heart">♥</span></p>

      plan:[

        {t:"스팟",  x:"트윈폭포 · 와이아나파나파 블랙샌드비치 · 하나 타운"},

      plan:[

        {t:"12:15", x:"이동 → 쿠알로아랜치", n:"~12:45 도착", k:"+1일 07:15"},
        {t:"13:45", x:"쿠알로아랜치 티켓오피스 체크인", hl:true, n:"승마 시작 45분 전까지 필수", k:"+1일 08:45"},
        {t:"14:30", x:"2시간 승마 투어", hl:true, n:"종료 약 16:30", k:"+1일 09:30"},
        {t:"16:30", x:"복귀 → 와이키키", n:"~17:15 도착", k:"+1일 11:30"},
        {t:"저녁",  x:"와이키키 디너"},
      ]},
    { d:"11/03", w:"화", city:"oahu", title:"다이아몬드헤드 · 카카아코·알라모아나",
      plan:[
        {t:"06:00", x:"다이아몬드헤드 첫 타임 하이킹", hl:true, n:"와이키키 전경 여명이 예뻐요", k:"+1일 01:00"},
        {t:"낮",    x:"카카아코 벽화거리"},

      ]},
    { d:"11/04", w:"수", city:"oahu", title:"하나우마베이 스노클링 · 선셋 세일링",
      plan:[

        {t:"저녁",  x:"선셋 세일링", hl:true, n:"마지막 밤 분위기 내기 좋아요"},
      ]},

      ]},

      plan:[

      ]},

const cityMeta = {
  vegas:{name:"라스베가스", bar:"#FED57D", wash:"#F7F1E8"},  /* butter yellow · latte */
  maui: {name:"마우이",     bar:"#F0A351", wash:"#FCEDED"},  /* apricot jam · milk shake */
  oahu: {name:"오아후",     bar:"#98C1E9", wash:"#B3DFEB"},  /* attic window · rainy day */
};
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');

/* ---------- 세계시계 ---------- */
const CLOCKS = [
  {label:"한국",     tz:"Asia/Seoul",          cls:"kr"},
  {label:"라스베가스", tz:"America/Los_Angeles", cls:""},
  {label:"마우이",    tz:"Pacific/Honolulu",    cls:""},
  {label:"호놀룰루",  tz:"Pacific/Honolulu",    cls:""},
];
function renderClocks(){
  const now = new Date();
  $("#clocks").innerHTML = CLOCKS.map(c=>{
    const time = new Intl.DateTimeFormat('ko-KR',{timeZone:c.tz,hour:'2-digit',minute:'2-digit',hour12:false}).format(now);
    const date = new Intl.DateTimeFormat('ko-KR',{timeZone:c.tz,month:'long',day:'numeric',weekday:'short'}).format(now);
    return `<div class="clock ${c.cls}">
      <div class="lbl">${c.label}</div>
      <div class="time">${time}</div>
      <div class="date">${date}</div>
    </div>`;
  }).join("");
}
renderClocks();
setInterval(renderClocks, 1000);

/* ---------- 오늘 상태 + todayIdx ---------- */
let todayIdx = -1;
(function(){
  const today = new Date(); today.setHours(0,0,0,0);
  const start = new Date(DATA.tripStart+"T00:00:00");
  const end   = new Date(DATA.tripEnd+"T00:00:00");
  let msg;
  if (today < start){
    const d = Math.round((start-today)/864e5);
    msg = `출발까지 D-${d}`;
  } else if (today <= end){
    todayIdx = Math.round((today-start)/864e5);
    const day = DATA.days[todayIdx];
    msg = `오늘은 DAY ${todayIdx+1} · ${cityMeta[day.city].name}에 있어요`;
  } else {
    msg = "신혼여행을 마치고 돌아왔어요";
  }
  $("#status").textContent = msg;
})();

/* ---------- 한 줄 그라데이션 타임라인 ---------- */
(function(){
  const n = DATA.days.length;
  const gantt = $("#gantt");
  gantt.style.gridTemplateColumns = `repeat(${n},1fr)`;

  let html = DATA.days.map((d,i)=>
    `<div class="g-cell${i===n-1?' last':''}${i===todayIdx?' today':''}">${d.d.slice(3)}<span style="display:block;font-size:9px;color:${i===todayIdx?'#ddd':'var(--sub)'}">${d.w}</span>${d.fly?'<span class="fly">✈</span>':''}</div>`
  ).join("");

  const blocks = [];
  DATA.days.forEach((d,i)=>{
    const last = blocks[blocks.length-1];
    if (last && last.city===d.city) last.end = i+1;
    else blocks.push({city:d.city, start:i+1, end:i+1});
  });

  const pct = v => (v/n*100).toFixed(2);
  const stops = [];
  blocks.forEach((c,bi)=>{
    const col = cityMeta[c.city].bar;
    if (bi===0) stops.push(`${col} 0%`);
    else {
      const prev = cityMeta[blocks[bi-1].city].bar;
      stops.push(`${prev} ${pct(c.start-1)}%`, `${col} ${pct(c.start)}%`);
    }
    if (bi===blocks.length-1) stops.push(`${col} 100%`);
  });

  const segs = blocks.map(c=>{
    const left = pct(c.start-1), width = pct(c.end-c.start+1);
    return `<a class="seg" href="#day-${c.start-1}" style="left:${left}%;width:${width}%"><span>${cityMeta[c.city].name} · ${c.end-c.start+1}일</span></a>`;
  }).join("");
  html += `<div class="g-strip" style="background:linear-gradient(90deg, ${stops.join(", ")})">${segs}</div>`;

  gantt.innerHTML = html;
})();

/* ---------- 일정 ---------- */
function krParts(k){
  const m = k.match(/^\+1일 (.+)$/);
  return m ? {pre:"+1일", t:m[1]} : {pre:"", t:k};
}
function renderEvent(p){
  const isExact = /^\d{2}:\d{2}$/.test(p.t);
  let tm;
  if (isExact && p.k){
    const kp = krParts(p.k);
    tm = `<div class="tm"><span class="loc">${p.t}</span><span class="kr">${kp.pre?`<small>${kp.pre}</small>`:''}${kp.t}</span></div>`;
  } else if (isExact){
    tm = `<div class="tm"><span class="loc">${p.t}</span><span class="krtag">한국시간</span></div>`;
  } else {
    tm = `<div class="tm"><span class="loc">${p.t}</span></div>`;
  }
  const body = `<div class="bd">${p.hl?`<p class="x hl">${p.x}</p>`:`<p class="x">${p.x}</p>`}${p.n?`<p class="n">${p.n}</p>`:''}</div>`;
  return `<div class="ev">${tm}${body}</div>`;
}
$("#days").innerHTML = DATA.days.map((d,i)=>{
  const cm = cityMeta[d.city];
  const [mm,dd] = d.d.split('/').map(Number);
  return `<div class="day" id="day-${i}" style="--bar:${cm.bar};--wash:${cm.wash}">
    <div class="day-head">
      <span class="day-num">DAY ${pad(i+1)}</span>
      <h2>${mm}월 ${dd}일 <small>(${d.w})</small></h2>
      <span class="day-city">${cm.name}${d.fly?' · ✈ 이동일':''}</span>
    </div>
    <div class="day-title">${d.title}</div>
    <div class="events">${d.plan.map(renderEvent).join("")}</div>
  </div>`;
}).join("");
</script>
</body>
</html>
